name: Deploy

# Runs only where the repository variable DEPLOYMENT names a deployments/<id>/ folder: a fork's own deployment, or
# "staging" in the public repo (its own staging bridge, see docs/deploying.md "Staging"). With DEPLOYMENT unset the
# jobs are skipped, never red. Staging is also skipped while its secrets are missing; a fork's deployment instead
# refuses (red) without them, so a half-provisioned production bridge is noticed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: vars.DEPLOYMENT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check the deploy secrets are provisioned
        id: secrets
        env:
          DEPLOYMENT: ${{ vars.DEPLOYMENT }}
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CONTRACT_TOKEN: ${{ secrets.BRIDGE_CONTRACT_TOKEN != '' }}
        run: |
          if [ "$HAS_API_TOKEN" = true ] && [ "$HAS_ACCOUNT_ID" = true ] && [ "$HAS_CONTRACT_TOKEN" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOYMENT" = staging ]; then
            echo "::notice::Staging secrets are not provisioned; skipping the staging deploy (see docs/deploying.md, Staging)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and BRIDGE_CONTRACT_TOKEN must be set: run pnpm secrets:push -- --deployment $DEPLOYMENT"
            exit 1
          fi

  deploy:
    # The job name carries the deployment: the release gate (bin/release-gate.mjs) looks for "deploy (staging)".
    name: deploy (${{ vars.DEPLOYMENT }})
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT: ${{ vars.DEPLOYMENT }}
      CHIMERA_DEPLOYMENT: ${{ vars.DEPLOYMENT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE_CONTRACT_TOKEN: ${{ secrets.BRIDGE_CONTRACT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test test/deployment.test.mjs test/contract-check.test.mjs
      - run: pnpm validate:deployment -- --deployment "$DEPLOYMENT"
      # The committed staging origin is a placeholder until a Funtime admin fills in the account's workers.dev subdomain.
      - name: Check the staging origin is filled in
        if: env.DEPLOYMENT == 'staging'
        run: |
          if grep -q 'account-subdomain' deployments/staging/bridge.config.json deployments/staging/deployment.lock.json; then
            echo "::error::deployments/staging still has the placeholder origin; set it to https://chimera-staging.<subdomain>.workers.dev in bridge.config.json and deployment.lock.json"
            exit 1
          fi
      # Refuse before deployment if the post-deploy check cannot authenticate.
      - name: Check contract credential is provisioned
        run: test -n "$BRIDGE_CONTRACT_TOKEN"
      - run: pnpm gen:wrangler -- --deployment "$DEPLOYMENT"
      - run: pnpm build:responder
      - run: pnpm exec wrangler deploy -c ".generated/wrangler.$DEPLOYMENT.jsonc"
      - name: Check contracts and recover a stale Hub once
        run: pnpm contract:check -- --deployment "$DEPLOYMENT" --redeploy-on-stale
      - name: Staging smoke (status, send, task create, get and drop)
        if: env.DEPLOYMENT == 'staging'
        run: pnpm staging:smoke -- --deployment "$DEPLOYMENT"
